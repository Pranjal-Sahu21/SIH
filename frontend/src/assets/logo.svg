<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="omniBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#14141b" />
    </linearGradient>

    <!-- Cyan-to-Emerald Primary Gradient -->
    <linearGradient id="omniPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="omniAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="omniGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="omniSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Favicon Container Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#omniBgGrad)" stroke="#27272a" stroke-width="8" />
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#omniPrimaryGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Cyber Security Shield Frame -->
  <path d="M256 72 L412 144 V268 C412 354 346 422 256 448 C166 422 100 354 100 268 V144 L256 72 Z" 
        fill="#09090b" 
        fill-opacity="0.75"
        stroke="url(#omniPrimaryGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#omniSubtleGlow)" />

  <!-- Outer Orbital Data Stream Ring -->
  <circle cx="256" cy="252" r="92" fill="none" stroke="url(#omniPrimaryGrad)" stroke-width="16" stroke-dasharray="400 90" stroke-linecap="round" />

  <!-- Inner Log Flow Brackets < / > -->
  <!-- Left Log Bracket < -->
  <path d="M172 228 L144 252 L172 276" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Log Bracket > -->
  <path d="M340 228 L368 252 L340 276" stroke="#22d3ee" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central OCSF Hex Core -->
  <path d="M256 188 L304 216 V272 L256 300 L208 272 V216 Z" 
        fill="url(#omniAccentGrad)" 
        fill-opacity="0.25"
        stroke="#22d3ee" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- AI Core Node & Pulse Ring -->
  <circle cx="256" cy="244" r="22" fill="#06b6d4" filter="url(#omniGlow)" />
  <circle cx="256" cy="244" r="10" fill="#ffffff" />

  <!-- Signal Nodes -->
  <circle cx="256" cy="120" r="7" fill="#22d3ee" />
  <line x1="256" y1="127" x2="256" y2="152" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" />

  <circle cx="256" cy="384" r="7" fill="#10b981" />
  <line x1="256" y1="336" x2="256" y2="377" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
</svg>
